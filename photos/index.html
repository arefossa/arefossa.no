<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photos · Are Bue Fosså</title>
  <meta name="description" content="Photos by Are Bue Fosså.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">Are Bue Fosså</a>
      <nav class="site-nav" aria-label="Main">
        <a href="/about/">About</a>
        <a href="/photos/" aria-current="page">Photos</a>
        <a href="https://wattsup.arefossa.no/">WattsUp <span class="ext" aria-hidden="true">↗</span></a>
        <a href="/morning-news/">Morning news</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <p class="eyebrow">Photos</p>
      <h1>A November morning</h1>
      <p class="lede">Blue hour and first light on 7 November 2026.</p>

      <!-- Miniatyrene velger hvilket bilde som vises stort. Uten skript virker de som lenker til
           #id, og CSS viser bildet med den id-en. Nye bilder: se README (Bilder). -->
      <div class="viewer" id="viewer">
        <ul class="thumbs" aria-label="Choose a photo">
          <li><a href="#moon" aria-current="true"><img src="/photos/img/2026-11-07-moon-thumb.jpg" width="400" height="267" alt="Crescent moon"></a></li>
          <li><a href="#boat"><img src="/photos/img/2026-11-07-boat-thumb.jpg" width="400" height="267" alt="Upturned boat"></a></li>
          <li><a href="#fox"><img src="/photos/img/2026-11-07-fox-thumb.jpg" width="400" height="225" alt="Fox in the sun"></a></li>
          <li><a href="#fox-2"><img src="/photos/img/2026-11-07-fox-2-thumb.jpg" width="400" height="225" alt="Fox on the move"></a></li>
        </ul>

        <div class="stage">
          <figure id="moon">
            <div class="frame"><img src="/photos/img/2026-11-07-moon-960.jpg" srcset="/photos/img/2026-11-07-moon-960.jpg 960w, /photos/img/2026-11-07-moon-1920.jpg 1920w" sizes="(min-width: 62rem) 59.5rem, calc(100vw - 40px)" width="1920" height="1280" fetchpriority="high" alt="A thin crescent moon and a bright point of light above the dark outline of a hill, in a deep blue sky that turns orange at the horizon."></div>
            <figcaption><span class="title">Crescent moon</span> <span class="when">7 Nov 2026 · 08:17</span> <span class="count"></span></figcaption>
          </figure>
          <figure id="boat">
            <div class="frame"><img src="/photos/img/2026-11-07-boat-960.jpg" srcset="/photos/img/2026-11-07-boat-960.jpg 960w, /photos/img/2026-11-07-boat-1920.jpg 1920w" sizes="(min-width: 62rem) 59.5rem, calc(100vw - 40px)" width="1920" height="1280" loading="lazy" alt="An upturned boat on bare rock in the blue hour, below a rocky ridge with a small cairn on top."></div>
            <figcaption><span class="title">Upturned boat</span> <span class="when">7 Nov 2026 · 08:18</span> <span class="count"></span></figcaption>
          </figure>
          <figure id="fox">
            <div class="frame"><img src="/photos/img/2026-11-07-fox-960.jpg" srcset="/photos/img/2026-11-07-fox-960.jpg 960w, /photos/img/2026-11-07-fox-1920.jpg 1920w" sizes="(min-width: 62rem) 59.5rem, calc(100vw - 40px)" width="1920" height="1080" loading="lazy" alt="A red fox sitting on a frosty rock in low morning sun, looking towards the camera."></div>
            <figcaption><span class="title">Fox in the sun</span> <span class="when">7 Nov 2026 · 10:02</span> <span class="count"></span></figcaption>
          </figure>
          <figure id="fox-2">
            <div class="frame"><img src="/photos/img/2026-11-07-fox-2-960.jpg" srcset="/photos/img/2026-11-07-fox-2-960.jpg 960w, /photos/img/2026-11-07-fox-2-1920.jpg 1920w" sizes="(min-width: 62rem) 59.5rem, calc(100vw - 40px)" width="1920" height="1080" loading="lazy" alt="A red fox with a white-tipped tail walking between boulders and frosted grass."></div>
            <figcaption><span class="title">Fox on the move</span> <span class="when">7 Nov 2026 · 10:03</span> <span class="count"></span></figcaption>
          </figure>

          <div class="nav">
            <button type="button" data-step="-1" aria-label="Previous photo"><span aria-hidden="true">‹</span></button>
            <button type="button" data-step="1" aria-label="Next photo"><span aria-hidden="true">›</span></button>
          </div>
        </div>
        <p class="sr-only" id="viewer-status" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">© 2026 Are Bue Fosså</div>
  </footer>

  <script src="/photos/photos.js"></script>
</body>
</html>
