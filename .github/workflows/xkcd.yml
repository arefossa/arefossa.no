# Henter siste xkcd til morning-news/xkcd.json, som Morning news-siden viser.
# xkcd.com sender ikke CORS-headere, så nettleseren kan ikke hente den selv. Nye striper kommer
# mandag, onsdag og fredag (amerikansk tid); vi sjekker hver morgen og committer bare ved endring.
name: xkcd

on:
  schedule:
    - cron: "15 5 * * *"   # 06:15 norsk vintertid
  workflow_dispatch:        # kan også kjøres for hånd under Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent siste xkcd
        run: |
          curl -fsS https://xkcd.com/info.0.json \
            | jq '{num, title, alt, img, year, month, day}' > morning-news/xkcd.json

      - name: Commit hvis den er ny
        run: |
          if git diff --quiet -- morning-news/xkcd.json; then
            echo "Ingen ny stripe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add morning-news/xkcd.json
          git commit -m "xkcd $(jq -r .num morning-news/xkcd.json)"
          git push
